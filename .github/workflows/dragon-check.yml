# TEMPORARY (test-dragons only): imports the project, runs the dragon test and the class/carousel/sound smoke
# tests, and renders screenshots of the class picker and each dragon in the camp. Remove before merging.
name: Dragon check

on:
  push:
    branches: ['test-dragons']
  workflow_dispatch:

permissions:
  contents: write     # the screenshots are pushed to the temporary branch dragon-shots (artifacts can't be fetched from the cloud workspace)

concurrency:
  group: dragon-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Import project
        run: |
          # --import waits for the scan and every import (a bare --editor --quit aborts the scan, leaving no class cache)
          godot --headless --import 2>&1 | tee import.log || true
          godot --headless --editor --quit-after 900 2>&1 | tee -a import.log || true
          ls .godot/global_script_class_cache.cfg && grep -c "class" .godot/global_script_class_cache.cfg || echo "no class cache"
          echo "---- script errors during import ----"
          grep -nE "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Identifier not found|ERROR: .*\.gd" import.log || echo "none"

      - name: Dragon test
        run: timeout 900 godot --headless --path . -s tools/dragon_test.gd --fixed-fps 60 2>&1 | tee dragon_test.log; grep -nE "SCRIPT ERROR|Parse Error" dragon_test.log || true

      - name: Smoke tests
        continue-on-error: true
        run: |
          for t in class_carousel_test sound_test char_test title_test playtest coop_fx_test; do
            echo "======== $t"
            timeout 600 godot --headless --path . -s tools/$t.gd --fixed-fps 60 2>&1 | tee $t.log | grep -E "FAIL|SCRIPT ERROR|Parse Error|done|failed" | head -40 || true
          done

      - name: Screenshots
        continue-on-error: true
        run: |
          apt-get update -qq && apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 git > /dev/null 2>&1 || true
          mkdir -p shots
          for c in wyrm serpent wyvern; do
            timeout 900 xvfb-run -a -s "-screen 0 1024x576x24" godot --rendering-driver opengl3 --path . -s tools/dragon_shots.gd -- shots $c 2>&1 | grep -E "\[DS\]|SCRIPT ERROR" || true
          done
          ls -la shots

      - name: Publish screenshots to the dragon-shots branch
        continue-on-error: true
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd shots && git init -q && git checkout -q -b dragon-shots
          git -c user.name=ci -c user.email=ci@localhost add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "dragon screenshots ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" dragon-shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dragon-check
          path: |
            *.log
            shots
          retention-days: 3
