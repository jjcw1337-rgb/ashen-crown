name: Nightly audit runner contracts
on:
  push:
    paths: ['tools/performance_audit/**', '.github/workflows/performance-audit-runner.yml']
  pull_request:
    paths: ['tools/performance_audit/**', '.github/workflows/performance-audit-runner.yml']
permissions:
  contents: read
jobs:
  runner-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m unittest discover -s tools/performance_audit -v
