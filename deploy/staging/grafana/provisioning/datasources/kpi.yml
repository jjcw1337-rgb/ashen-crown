# The KPI database (docs/systems/performance_kpis.md): PostgreSQL database `kpi` in the staging backend's postgres, read through
# the read-only role grafana_ro (its password is GRAFANA_PG_PASSWORD in nakama.env on the server, never in Git).
apiVersion: 1
datasources:
  - name: KPI
    uid: kpi-pg
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana_ro
    isDefault: true
    jsonData:
      database: kpi
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: $GRAFANA_PG_PASSWORD
