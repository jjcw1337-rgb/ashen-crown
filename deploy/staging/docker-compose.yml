# Ashen Crown STAGING backend: Nakama + its own PostgreSQL. Production gets its own copy of this on its own server
# with its own database; nothing here is shared with it.
# Secrets come from nakama.env next to this file on the server (made by setup.sh, mode 600, never in Git):
#   POSTGRES_PASSWORD, NAKAMA_SERVER_KEY, NAKAMA_SESSION_KEY, NAKAMA_REFRESH_KEY, NAKAMA_HTTP_KEY, NAKAMA_CONSOLE_PASSWORD,
#   GRAFANA_ADMIN_PASSWORD, GRAFANA_PG_PASSWORD (grafana_setup.sh)
#   docker compose --env-file nakama.env up -d
# Ports: the game reaches Nakama only through Caddy's HTTPS on 443 (80 for the certificate's ACME challenge);
# Nakama's own 7350 is on the server's loopback (the match servers on the same box use it), the console 7351
# too (`ssh -L 7351:127.0.0.1:7351 ashen-crown-staging`); PostgreSQL is never published. Grafana (players, errors and
# logs, docs/systems/telemetry.md) is behind Caddy at https://<STAGING_HOST>/grafana/ with a login; Loki keeps the server's logs
# (shipped by Alloy from the journal and the containers) for it, docs/systems/telemetry.md.
# STAGING_HOST (the server's public IP, the certificate's name) is in nakama.env too.
name: ashen-staging
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: nakama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nakama -d nakama"]
      interval: 5s
      timeout: 3s
      retries: 20
  nakama:
    image: heroiclabs/nakama:3.41.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - >
        /nakama/nakama migrate up --database.address nakama:${POSTGRES_PASSWORD}@postgres:5432/nakama &&
        exec /nakama/nakama --name ashen-staging
        --database.address nakama:${POSTGRES_PASSWORD}@postgres:5432/nakama
        --socket.server_key ${NAKAMA_SERVER_KEY}
        --session.encryption_key ${NAKAMA_SESSION_KEY}
        --session.refresh_encryption_key ${NAKAMA_REFRESH_KEY}
        --session.token_expiry_sec 7200
        --runtime.http_key ${NAKAMA_HTTP_KEY}
        --runtime.path /nakama/data/modules
        --console.username admin --console.password ${NAKAMA_CONSOLE_PASSWORD}
        --logger.level INFO
    volumes:
      - ./modules:/nakama/data/modules:ro
    ports:
      - "127.0.0.1:7350:7350"
      - "127.0.0.1:7351:7351"
  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    depends_on:
      - nakama
    environment:
      STAGING_HOST: ${STAGING_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
  grafana:
    image: grafana/grafana-oss:11.3.0
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${STAGING_HOST}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/telemetry.json
      GRAFANA_PG_PASSWORD: ${GRAFANA_PG_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
  loki:
    image: grafana/loki:3.2.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
  alloy:
    image: grafana/alloy:v1.4.3
    restart: unless-stopped
    depends_on:
      - loki
    command: ["run", "--disable-reporting", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./loki/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
volumes:
  loki_data:
  alloy_data:
  grafana_data:
  pgdata:
  caddy_data:
  caddy_config:
